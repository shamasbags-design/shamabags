<style>
  :root { --rose:#D4537E; --mauve:#8e5b5c; --deep:#6b4344; --cream:#FBF3EF; --line:#F0DCE1; --ink:#3A3A3A; --gold:#C9A27A; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:'El Messiri','Poppins',sans-serif; }
  .top { background:linear-gradient(135deg,var(--mauve),var(--deep)); color:#F6DCC0; text-align:center; padding:30px 18px 26px; }
  .top h1 { margin:0 0 6px; font:700 30px 'Aref Ruqaa','El Messiri',serif; }
  .top .meta { font-size:14px; opacity:.9; line-height:1.9; }
  .top .meta b { font-family:'Poppins',sans-serif; letter-spacing:.02em; }
  .wrap { max-width:680px; margin:0 auto; padding:18px 14px 50px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:20px; padding:18px; margin-bottom:14px; box-shadow:0 8px 22px rgba(90,52,52,.07); }
  .card h2 { margin:0 0 12px; font:700 17px 'El Messiri',sans-serif; color:var(--deep); }
  .row { display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:15px; }
  .row:last-child { border-bottom:none; }
  .row .k { color:var(--mauve); font-weight:700; min-width:96px; }
  .row .v { flex:1; word-break:break-word; }
  .ltr { direction:ltr; unicode-bidi:isolate; display:inline-block; }
  .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .btn { flex:1 1 140px; text-align:center; padding:11px 12px; border-radius:12px; text-decoration:none; font:600 14px 'El Messiri',sans-serif; border:1px solid var(--line); color:var(--deep); background:#fff; cursor:pointer; }
  .btn.wa { background:#25D366; border-color:#25D366; color:#fff; }
  .btn.rose { background:var(--rose); border-color:var(--rose); color:#fff; }
  .item { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:none; padding-bottom:0; }
  .item img { width:84px; height:120px; object-fit:cover; border-radius:12px; background:#f4e9e4; flex-shrink:0; }
  .item .ph { width:84px; height:120px; border-radius:12px; background:#f4e9e4; display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
  .item .in { flex:1; min-width:0; }
  .item .nm { font-weight:700; font-size:15.5px; line-height:1.5; }
  .item .sub { font-size:13px; color:#8a6e72; margin-top:2px; line-height:1.8; }
  .item .pr { margin-top:6px; font:600 14px 'Poppins',sans-serif; color:var(--rose); }
  .gift { display:inline-block; margin-top:4px; font-size:12px; background:#fbeee6; color:var(--mauve); border:1px solid #ecd0cb; border-radius:20px; padding:2px 10px; }
  .item a { color:var(--mauve); font-size:12.5px; }
  .sum { display:flex; justify-content:space-between; padding:5px 0; font-size:15px; }
  .sum.total { font:700 19px 'El Messiri',sans-serif; border-top:1px solid var(--line); margin-top:6px; padding-top:10px; color:var(--deep); }
  .free { color:#1f9d55; font-weight:700; }
  .err { text-align:center; padding:70px 20px; color:#8a6e72; line-height:2; }
  @media print { .acts, .noprint { display:none !important; } body { background:#fff; } .card { box-shadow:none; } }
</style>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function b64urlDecode(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
  return decodeURIComponent(escape(atob(s)));
}
function money(n){ return (Math.round(n*100)/100).toLocaleString('en-US') + ' ₺'; }
function waDigits(p){ var d = String(p||'').replace(/\D/g,''); if (d.indexOf('00')===0) d = d.slice(2); if (d.charAt(0)==='0') d = '90' + d.slice(1); return d; }
function render(o){
  var c = o.c || {}, items = o.i || [], sum = 0, all = items.length > 0, pcs = 0, gift = 0;
  items.forEach(function(i){ pcs += i.q; if (i.g) gift += i.q; if (i.p == null) all = false; else sum += i.p * i.q; });
  var h = '<div class="top"><h1>طلب جديد 🛍️</h1><div class="meta">رقم الطلب: <b>'+esc(o.n)+'</b><br>'+esc(o.t||'')+'</div></div><div class="wrap">';
  h += '<div class="card"><h2>👤 بيانات الزبونة</h2>' +
    '<div class="row"><span class="k">الاسم</span><span class="v">'+esc(c.n)+'</span></div>' +
    '<div class="row"><span class="k">الهاتف</span><span class="v"><span class="ltr">'+esc(c.p)+'</span></span></div>' +
    '<div class="row"><span class="k">المدينة</span><span class="v">'+esc(c.ct)+'</span></div>' +
    '<div class="row"><span class="k">المنطقة</span><span class="v">'+esc(c.d)+'</span></div>' +
    '<div class="row"><span class="k">البناية / الشقة</span><span class="v">'+esc(c.b)+' / '+esc(c.a)+'</span></div>' +
    (c.o ? '<div class="row"><span class="k">ملاحظات</span><span class="v">'+esc(c.o)+'</span></div>' : '') +
    '<div class="acts"><a class="btn wa" href="https://wa.me/'+waDigits(c.p)+'" target="_blank" rel="noopener">واتساب الزبونة</a>' +
    '<a class="btn" href="tel:+'+waDigits(c.p)+'">اتصال</a>' +
    (c.l ? '<a class="btn rose" href="'+esc(c.l)+'" target="_blank" rel="noopener">📍 الموقع على الخريطة</a>' : '') + '</div></div>';
  h += '<div class="card"><h2>🧾 المنتجات ('+items.length+')</h2>';
  items.forEach(function(i){
    var e = CAT[i.i], img = e ? '<img alt="" src="'+e[1]+'">' : '<div class="ph">👜</div>';
    h += '<div class="item">'+img+'<div class="in"><div class="nm">'+esc(i.n)+'</div><div class="sub">SKU: SH-'+esc(String(i.i).toUpperCase())+
      (i.c ? '<br>اللون: '+esc(i.c) : '') + (i.b ? '<br>مقاس القاعدة: '+esc(i.b)+' سم' : '') + '<br>الكمية: '+esc(i.q)+'</div>' +
      '<div class="pr">'+(i.p != null ? esc(money(i.p))+' × '+esc(i.q)+' = '+esc(money(i.p*i.q)) : 'السعر يُحدد عند التأكيد')+'</div>' +
      (i.g ? '<span class="gift">🎁 تغليف هدية (بفرق سعر بسيط)</span><br>' : '') +
      (e ? '<a href="'+esc(e[0])+'#'+esc(i.i)+'" target="_blank" rel="noopener">عرض المنتج بالموقع ›</a>' : '') + '</div></div>';
  });
  h += '</div><div class="card"><div class="sum"><span>عدد القطع</span><b>'+pcs+'</b></div>' +
    (gift ? '<div class="sum"><span>قطع بتغليف هدية</span><b>'+gift+'</b></div>' : '') +
    '<div class="sum"><span>أجرة الشحن</span><span class="free">مجاني 🎁</span></div>' +
    '<div class="sum total"><span>الإجمالي</span><span>'+(all ? esc(money(sum)) : 'يُحدد عند التأكيد')+'</span></div>' +
    '<div class="acts noprint"><button class="btn" onclick="window.print()">🖨️ طباعة / حفظ PDF</button></div></div></div>';
  document.getElementById('app').innerHTML = h;
  document.title = 'طلب ' + (o.n || '') + ' | شامة';
}
(function(){
  var q = new URLSearchParams(location.search).get('o');
  if (!q) { document.getElementById('app').innerHTML = '<div class="err">ما في طلب لعرضه.<br>افتحي الرابط من رسالة الطلب بواتساب.</div>'; return; }
  try { render(JSON.parse(b64urlDecode(q))); }
  catch (e) { document.getElementById('app').innerHTML = '<div class="err">تعذّر قراءة الطلب.<br>تأكدي إن الرابط كامل ومنسوخ بدون نقص.</div>'; }
